name: Update Helm Dependencies

on:
    schedule:
        # Run weekly on Monday at 9 AM UTC
        - cron: "0 9 * * 1"
    workflow_dispatch: # Allow manual triggering

jobs:
    update-helm-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Needed for git history operations

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.14.0 # Use the latest stable version

            - name: Find and update all charts
              id: update-charts
              run: |
                  # Initialize variables
                  UPDATES_FOUND=false
                  CHANGES_REPORT=""

                  # Find all directories in charts/ that contain Chart.yaml
                  while IFS= read -r -d '' chart_dir; do
                    echo "Processing chart in: $chart_dir"

                    # Change to chart directory
                    cd "$chart_dir" || continue

                    # Check if Chart.yaml exists and has dependencies
                    if [ -f Chart.yaml ] && grep -q "dependencies:" Chart.yaml; then
                      echo "Found dependencies in $chart_dir"

                      # Run helm dependency update
                      helm dependency update

                      # Check for changes
                      if ! git diff --quiet; then
                        UPDATES_FOUND=true
                        CHANGES_REPORT+="### $(basename "$chart_dir")\n"
                        CHANGES_REPORT+="```diff\n"
                        CHANGES_REPORT+="$(git diff Chart.yaml Chart.lock | head -n 20)\n"
                        CHANGES_REPORT+="... (truncated)\n"
                        CHANGES_REPORT+="```\n\n"
                      fi
                    fi

                    # Return to root directory
                    cd "$GITHUB_WORKSPACE"
                  done < <(find charts -name Chart.yaml -print0 | xargs -0 dirname)

                  # Set outputs
                  echo "updates_found=$UPDATES_FOUND" >> $GITHUB_OUTPUT
                  echo "changes_report<<EOF" >> $GITHUB_OUTPUT
                  echo "$CHANGES_REPORT" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Create PR with updates
              if: steps.update-charts.outputs.updates_found == 'true'
              uses: peter-evans/create-pull-request@v5
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: "chore: update helm dependencies in charts"
                  title: "chore: update helm dependencies in charts"
                  body: |
                      This PR updates the Helm dependencies in all charts to their latest versions.

                      The following changes were made:

                      ${{ steps.update-charts.outputs.changes_report }}

                      Please review the changes and merge if they look good.
                  branch: "helm-dependency-updates/all-charts"
                  base: "main"
                  labels: "dependencies,helm,automation"
