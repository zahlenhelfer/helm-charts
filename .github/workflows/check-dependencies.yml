name: Check Helm Dependencies (Separate PRs)

on:
    schedule:
        # Run weekly on Monday at 9 AM UTC
        - cron: "0 9 * * 1"
    workflow_dispatch: # Allow manual triggering

jobs:
    update-helm-dependencies:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Needed for git history operations

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.14.0 # Use the latest stable version

            - name: Find charts with dependency updates
              id: find-updates
              run: |
                  # Find all directories in charts/ that contain Chart.yaml with dependencies
                  UPDATES_FOUND=false
                  CHART_LIST=""

                  while IFS= read -r -d '' chart_dir; do
                    if [ -f "$chart_dir/Chart.yaml" ] && grep -q "dependencies:" "$chart_dir/Chart.yaml"; then
                      echo "Checking $chart_dir for updates"

                      # Change to chart directory and check for updates
                      cd "$chart_dir"
                      helm dependency update

                      if ! git diff --quiet; then
                        UPDATES_FOUND=true
                        CHART_LIST+="$chart_dir|"
                      fi

                      cd "$GITHUB_WORKSPACE"
                    fi
                  done < <(find charts -name Chart.yaml -print0 | xargs -0 dirname)

                  echo "updates_found=$UPDATES_FOUND" >> $GITHUB_OUTPUT
                  echo "chart_list=$CHART_LIST" >> $GITHUB_OUTPUT

            - name: Create PRs for each chart
              if: steps.find-updates.outputs.updates_found == 'true'
              run: |
                  # Split the chart list and process each one
                  IFS='|' read -ra CHARTS <<< "${{ steps.find-updates.outputs.chart_list }}"

                  for chart_dir in "${CHARTS[@]}"; do
                    if [ -z "$chart_dir" ]; then
                      continue
                    fi

                    chart_name=$(basename "$chart_dir")
                    branch_name="helm-dependency-update/$chart_name-$(date +%Y%m%d)"

                    # Create a new branch for this chart's updates
                    git checkout -b "$branch_name"

                    # Reset to clean state except for this chart's changes
                    git checkout main -- .
                    git add "$chart_dir/Chart.yaml" "$chart_dir/Chart.lock"
                    git commit -m "chore: update helm dependencies in $chart_name chart"

                    # Push and create PR
                    git push origin "$branch_name"

                    # Create PR using GitHub CLI
                    gh pr create \
                      --title "chore: update helm dependencies in $chart_name chart" \
                      --body "This PR updates the Helm dependencies in the $chart_name chart to their latest versions.

                      The changes include:
                      ```bash
                      $(cd "$chart_dir" && git diff HEAD~1 -- Chart.yaml Chart.lock)
                      ```" \
                      --base main \
                      --head "$branch_name" \
                      --label "dependencies,helm,automation" \
                      --reviewer "kyverno-maintainers" \
                      --assignee "kyverno-maintainers"

                    # Return to main branch
                    git checkout main
                  done
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
