name: Check Helm Dependency Updates

on:
    schedule:
        - cron: "0 9 * * 1" # Runs every Monday at 9 AM UTC
    workflow_dispatch: # Allows manual triggering
    pull_request:
        paths:
            - "charts/**"

jobs:
    check-dependencies:
        name: Check for Helm dependency updates
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Get full git history for proper diffing

            - name: Set up Helm
              uses: azure/setup-helm@v3
              with:
                  version: v3.14.0 # Use the latest stable version

            - name: Install yq for YAML processing
              run: sudo apt install yq

            - name: Check for dependency updates
              id: check-updates
              run: |
                  # Initialize variables
                  UPDATES_FOUND=false
                  UPDATED_CHARTS=""

                  # Change to charts directory
                  cd charts || exit 1

                  # Process each subdirectory that contains a Chart.yaml
                  for chart_dir in */; do
                    if [ -f "${chart_dir}Chart.yaml" ]; then
                      echo "Checking dependencies for chart: ${chart_dir}"

                      # Change to chart directory
                      cd "$chart_dir" || continue

                      # Check if chart has dependencies
                      if grep -q "dependencies:" Chart.yaml; then
                        echo "Found dependencies in ${chart_dir}, checking for updates..."

                        # Store original Chart.lock for comparison
                        if [ -f Chart.lock ]; then
                          cp Chart.lock Chart.lock.orig
                        fi

                        # Update dependencies
                        helm dependency update

                        # Check if Chart.lock was modified
                        if [ -f Chart.lock ] && ! diff -q Chart.lock.orig Chart.lock >/dev/null 2>&1; then
                          UPDATES_FOUND=true
                          UPDATED_CHARTS="${UPDATED_CHARTS}${chart_dir},"

                          echo "✅ Updates found for ${chart_dir}"
                          echo "--- Dependency changes ---"
                          diff -u Chart.lock.orig Chart.lock | head -n 20
                          echo "... (truncated)"
                          echo "--------------------------"
                        else
                          echo "❌ No updates found for ${chart_dir}"
                        fi

                        # Clean up
                        if [ -f Chart.lock.orig ]; then
                          rm Chart.lock.orig
                        fi
                      else
                        echo "No dependencies found in ${chart_dir}"
                      fi

                      # Return to charts directory
                      cd ..
                    fi
                  done

                  # Set outputs
                  echo "updates_found=${UPDATES_FOUND}" >> $GITHUB_OUTPUT
                  echo "updated_charts=${UPDATED_CHARTS%,}" >> $GITHUB_OUTPUT  # Remove trailing comma

            - name: Create update summary
              if: steps.check-updates.outputs.updates_found == 'true'
              run: |
                  echo "### Helm Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "The following charts have dependency updates available:" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  IFS=',' read -ra CHARTS <<< "${{ steps.check-updates.outputs.updated_charts }}"
                  for chart in "${CHARTS[@]}"; do
                    echo "- \`${chart}\`" >> $GITHUB_STEP_SUMMARY
                  done >> $GITHUB_STEP_SUMMARY

                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "To update these dependencies, run:" >> $GITHUB_STEP_SUMMARY
                  echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
                  echo "cd charts" >> $GITHUB_STEP_SUMMARY
                  for chart in "${CHARTS[@]}"; do
                    echo "cd ${chart} && helm dependency update && cd .." >> $GITHUB_STEP_SUMMARY
                  done
                  echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

            - name: Fail if updates found (for PR checks)
              if: steps.check-updates.outputs.updates_found == 'true' && github.event_name == 'pull_request'
              run: |
                  echo "::error::Helm dependency updates are available. Please run 'helm dependency update' for the affected charts."
                  exit 1
