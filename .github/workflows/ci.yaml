name: CI
on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

jobs:
  lint:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.12.0

      - name: Lint Helm Charts
        run: |
          helm lint charts/*

  unittest:
    name: Helm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: d3adb5/helm-unittest-action@v2
        with:
          helm-version: v3.15.2
          unittest-version: "~0.2"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Generate Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          git-push: false
      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT
          fi
      - name: Create Pull Request
        if: steps.git-check.outputs.no_changes != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update Helm documentation"
          branch: "docs/helm-docs-update"
          title: "chore: update Helm documentation"
          body: "Automated Helm documentation updates generated by helm-docs."
          labels: "documentation,automated"

  release:
    name: Release Charts
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          packages_with_index: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
