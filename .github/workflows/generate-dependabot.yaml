name: Generate Dependabot Config

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
  workflow_dispatch:

jobs:
  generate-dependabot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: delete existing dependabot.yaml
        run: |
          rm -f .github/dependabot.yml

      - name: Generate dependabot.yaml
        run: |
          {
            echo "version: 2"
            echo "updates:"
            echo "  - package-ecosystem: \"github-actions\""
            echo "    directory: \"/\""
            echo "    schedule:"
            echo "      interval: \"weekly\""
          } > .github/dependabot.yml

          find charts -type f -name "Chart.yaml" | sort | while read -r chart_file; do
            chart_dir=$(dirname "$chart_file")
            {
              echo "  - package-ecosystem: \"helm\""
              echo "    directory: \"/$chart_dir\""
              echo "    schedule:"
              echo "      interval: \"weekly\""
            } >> .github/dependabot.yml
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: auto-generate dependabot.yml"
          branch: "chore/dependabot-config-update"
          title: "chore: auto-generate dependabot.yml"
          body: "Automated dependabot.yml update generated from charts/*/Chart.yaml."
          add-paths: .github/dependabot.yml
